name: MatEdit Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build-linux-gcc:
    name: Build Linux x64 GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Package
        run: |
          mkdir -p package
          cp build/MaterialEditor package/MaterialEditor
          tar -czf MatEdit-linux-x64.tar.gz -C package MaterialEditor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-linux-x64
          path: MatEdit-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux-clang:
    name: Build Linux x64 Clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

  build-windows:
    name: Build Windows x64 MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item `
            build\Release\MaterialEditor.exe `
            package\MaterialEditor.exe

          Compress-Archive `
            -Path package\MaterialEditor.exe `
            -DestinationPath MatEdit-windows-x64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatEdit-windows-x64
          path: MatEdit-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest

    needs:
      - build-linux-gcc
      - build-linux-clang
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-linux-x64
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: MatEdit-windows-x64
          path: release

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Remove all tags
        run: |
          set -e

          git fetch --tags --force

          git tag --list | while read -r tag; do
            if [ "$tag" != "nightly" ]; then
              echo "Deleting tag: $tag"
              git push origin ":refs/tags/$tag"
            fi
          done

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            release/MatEdit-linux-x64.tar.gz \
            release/MatEdit-windows-x64.zip \
            --target "${GITHUB_SHA}" \
            --title "MatEdit Nightly" \
            --prerelease
